# The ingress controller for photos.seanpe.io.
#
# k3s was installed with traefik disabled because the original plan routed everything through
# cloudflared straight to Services. That plan changed: a Cloudflare Tunnel caps request bodies at
# 100 MB and Immich has no chunked uploads, so remote uploads go direct to this controller instead,
# over a port-forward, with no proxy in the path.
#
# proxy-body-size: "0" is the single most important line here. nginx defaults to 1 MB, which would
# reject nearly every photo — a far tighter limit than the Cloudflare cap this setup exists to
# avoid. "0" means unlimited and the timeouts below give a slow phone time to finish a large video.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 1h
  releaseName: ingress-nginx
  chart:
    spec:
      chart: ingress-nginx
      version: 4.15.1        # appVersion 1.15.1
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
  values:
    controller:
      service:
        # k3s servicelb binds these on every node address, so 80/443 land on the LAN IP the router
        # forwards to. Both ports were verified free on donnager before this was written.
        type: LoadBalancer
      config:
        proxy-body-size: "0"         # unlimited; the 1 MB default would break uploads entirely
        proxy-read-timeout: "600"    # a large video over a slow uplink exceeds the 60s default
        proxy-send-timeout: "600"
        client-body-timeout: "600"
      # Single node: one replica is all servicelb can usefully front.
      replicaCount: 1
