all:
  children:
    homelab:
      hosts:
        donnager:
          ansible_host: "{{ tailnet_ip }}"   # from group_vars; stable across the pemily-homelab → donnager rename
          ansible_user: pemily
          # Ubuntu 26.04 defaults to sudo-rs, which rewraps become's -p prompt ("[sudo: <prompt>] Password:"),
          # so Ansible never sees it and times out. The classic sudo is still installed as sudo.ws.
          ansible_become_exe: sudo.ws
    seanpe_homelab:
      hosts:
        seanpe-homelab-1:
          ansible_host: 10.77.0.10          # Incus bridge on donnager; reached by jumping through it
          ansible_user: ubuntu              # passwordless sudo from cloud-init
          ansible_ssh_common_args: -o ProxyJump={{ homelab_user }}@{{ tailnet_ip }} -o StrictHostKeyChecking=accept-new
