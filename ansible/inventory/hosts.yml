all:
  children:
    homelab:
      hosts:
        donnager:
          ansible_host: TAILNET_IP        # tailnet IP — stable across the pemily-homelab → donnager rename
          ansible_user: pemily
    seanpe_homelab:
      hosts:
        seanpe-homelab-1:
          ansible_host: 10.77.0.10          # Incus bridge on donnager; reached by jumping through it
          ansible_user: ubuntu              # passwordless sudo from cloud-init
          ansible_ssh_common_args: -o ProxyJump=pemily@TAILNET_IP -o StrictHostKeyChecking=accept-new
