# Single-node k3s server. Used for the pemily-homelab family cluster (host) and the seanpe-homelab VM.
# On the host, run after the lvm role, so local-path PVs land on the k3s-family LV and not on root.
- name: k3s storage LV is mounted (lvm role ran first)
  ansible.builtin.command: findmnt --mountpoint {{ k3s_storage_mount }}
  changed_when: false
  check_mode: false
  when: k3s_storage_mount | length > 0

- name: k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: k3s server config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: Restart k3s

- name: Read installed k3s version
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Install k3s {{ k3s_version }}
  when: k3s_version not in (k3s_installed.stdout | default(''))
  block:
    - name: Download the k3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/bin/k3s-install.sh
        mode: "0755"
        force: true

    - name: Run the install script
      ansible.builtin.command: /usr/local/bin/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server

- name: k3s is enabled and running
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started

- name: Wait for the node to be Ready
  ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Read the admin kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig

- name: Write ~/.kube/{{ k3s_cluster_name }}.yaml on the control machine
  become: false
  delegate_to: localhost
  ansible.builtin.copy:
    dest: "{{ lookup('env', 'HOME') }}/.kube/{{ k3s_cluster_name }}.yaml"
    mode: "0600"
    content: >-
      {{ k3s_kubeconfig.content | b64decode
         | replace('https://127.0.0.1:6443', k3s_api_url)
         | regex_replace('(?m)current-context: default$', 'current-context: ' ~ k3s_cluster_name)
         | regex_replace('(?m)cluster: default$', 'cluster: ' ~ k3s_cluster_name)
         | regex_replace('(?m)user: default$', 'user: ' ~ k3s_cluster_name)
         | regex_replace('(?m)name: default$', 'name: ' ~ k3s_cluster_name) }}
