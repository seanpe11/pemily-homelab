# Configuration that depends on CRDs installed by infrastructure/ (currently the cert-manager
# ClusterIssuers). Split out so a CRD and a resource using it never land in the same apply.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/family-config
  prune: true
  wait: true
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
